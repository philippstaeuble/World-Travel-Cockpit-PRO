<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WTCP">
<title>World Travel Cockpit PRO</title>
<style>
:root{--navy:#16324f;--blue:#2e6288;--green:#087b5a;--bg:#eef3f6;--card:#fff;--line:#dbe4e9;--text:#173042;--muted:#657782;--amber:#fff4d4;--red:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}button{font:inherit}
.wrap{max-width:1100px;margin:auto;padding:14px}.top{background:linear-gradient(120deg,var(--navy),#275f8d);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.top h1{font-size:22px;margin:0 0 8px}.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;opacity:.95}.notice{background:#e5f5ef;border:1px solid #aad8c8;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0000000d}.head{background:var(--green);color:#fff;padding:10px 12px;font-size:13px;font-weight:800}.head.blue{background:var(--blue)}.body{padding:14px;min-height:135px}.label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:8px}.value{font-size:18px;font-weight:800;margin:3px 0 8px}.event{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.time{font-weight:800}.small{font-size:13px;color:var(--muted);line-height:1.35}.route{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;text-align:center;font-weight:800;font-size:17px;margin:10px 0}.arrow{font-size:24px;color:var(--green)}.budget{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f6f9fa;border-radius:10px;padding:10px}.metric b{display:block;font-size:19px;margin-top:3px}.todo{background:var(--amber);border-radius:10px;padding:10px;margin-bottom:8px}.urgent{background:var(--red)}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.nav button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:12px 5px;font-weight:800;font-size:12px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}.hidden{display:none}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}
@media(max-width:720px){.wrap{padding:8px}.grid{grid-template-columns:1fr}.top{border-radius:10px}.nav{grid-template-columns:repeat(3,1fr)}.body{min-height:115px}.top h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<div class="notice" id="dataStatus">Reisedaten werden geladen …</div>
<div class="notice" id="budgetCheck" role="status"></div>
<header class="top"><h1>🌍 WORLD TRAVEL COCKPIT PRO</h1><div class="meta"><span id="dayLabel"></span><span id="phase"></span><span id="dateLabel"></span></div></header>
<div class="grid">
<section class="card"><div class="head">1. HEUTE – AKTIVITÄTEN</div><div class="body" id="todayActivities"></div></section>
<section class="card"><div class="head">2. HEUTE – ORT / HOTEL</div><div class="body" id="todayPlace"></div></section>
<section class="card"><div class="head blue">3. MORGEN – AKTIVITÄTEN</div><div class="body" id="tomorrowActivities"></div></section>
<section class="card"><div class="head blue">4. MORGEN – ORT / HOTEL</div><div class="body" id="tomorrowPlace"></div></section>
<section class="card"><div class="head blue">5. NÄCHSTER TRANSFER</div><div class="body" id="nextTransfer"></div></section>
<section class="card"><div class="head blue">6. NÄCHSTER FLUG</div><div class="body" id="nextFlight"></div></section>
<section class="card"><div class="head">7. TO-DO / PENDENZEN</div><div class="body" id="todos"></div></section>
<section class="card"><div class="head">8. BUDGETSTATUS / OFFENE POSTEN</div><div class="body" id="budget"></div></section>
</div>
<div class="nav"><button onclick="showInfo('Gesundheit')">Gesundheit</button><button onclick="showInfo('Packlisten')">Packlisten</button><button onclick="showInfo('Notfall')">Notfall</button><button onclick="showInfo('Reiseplan')">Reiseplan</button><button onclick="showInfo('Reiseunterlagen')">Reiseunterlagen</button></div>
<div id="info" class="card hidden" style="margin-top:14px"><div class="head blue" id="infoHead"></div><div class="body" id="infoBody"></div></div>
<div class="footer">World Travel Cockpit PRO · GitHub Pages · Cockpit V3.3</div>
</div>
<script>
let DATA;
async function loadData(){
 const response=await fetch('reisedaten.json',{cache:'no-store'});
 if(!response.ok)throw new Error('Reisedaten konnten nicht geladen werden (HTTP '+response.status+').');
 const data=await response.json();
 if(!data || !Array.isArray(data.records) || !data.records.every(r=>r && typeof r==='object' && !Array.isArray(r)))
  throw new Error('Ungültige Reisedaten: records muss eine Liste von Datensätzen sein.');
 if(!data.budget || !Number.isFinite(data.budget.open))
  throw new Error('Ungültige Reisedaten: budget.open fehlt oder ist keine Zahl.');
 return data;
}
function renderBudgetCheck(data){
 const numeric=value=>typeof value==='number' && Number.isFinite(value);
 const unknown=data.records.filter(r=>!numeric(r.open)||!numeric(r.cost));
 const sum=data.records.reduce((s,r)=>s+(numeric(r.open)?r.open:0),0),difference=data.budget.open-sum;
 const parts=['Budgetplan CHF '+data.budget.plan.toLocaleString('de-CH')+' aus bisherigem Cockpit übernommen.'];
 if(unknown.length)parts.push('Budget vorläufig: '+unknown.map(r=>'Daten!'+(!numeric(r.open)?'H':'G')+r.sourceRow+' = '+(r.openRaw??r.costRaw??'ungültig')).join('; ')+'. Ungeklärte Beträge sind in den Summen nicht enthalten.');
 parts.push(difference===0?'Bezifferte offene Beträge abgeglichen: CHF '+sum.toLocaleString('de-CH')+'.':'Budget prüfen: Differenz CHF '+difference.toLocaleString('de-CH')+'.');
 document.getElementById('budgetCheck').textContent=parts.join(' ');
}
const tripStart='2026-09-24',tripEnd='2026-11-11';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const parse=s=>new Date(s+'T12:00:00'),iso=d=>d.toISOString().slice(0,10);
const money=n=>'CHF '+Math.round(Number(n||0)).toLocaleString('de-CH');
const fmt=s=>parse(s).toLocaleDateString('de-CH',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
const isDone=r=>/erledigt|bezahlt|gebucht/i.test((r.status||'')+' '+(r.notes||''));
let now=new Date();now.setHours(12,0,0,0);let active=now<parse(tripStart)?parse(tripStart):now>parse(tripEnd)?parse(tripEnd):now;let tomorrow=new Date(active);tomorrow.setDate(active.getDate()+1);
const recFor=s=>DATA.records.filter(r=>r.date===s).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
function dayNum(s){return Math.round((parse(s)-parse(tripStart))/86400000)+1}
function displayText(r){return r.notes&&r.notes.length>12?r.notes:r.what||r.type}
function renderDay(id,s){const rows=recFor(s).filter(r=>!/Hotel/.test(r.type));$(id).innerHTML=rows.length?rows.map(r=>`<div class="event"><div class="time">${esc(r.time||'—')}</div><div><b>${esc(displayText(r))}</b><div class="small">${esc([r.from&&r.to?`${r.from} → ${r.to}`:(r.from||r.to),r.booking?`Buchung ${r.booking}`:'' ].filter(Boolean).join(' · '))}</div></div></div>`).join(''):'<div class="small">Keine Einträge.</div>'}
function placeInfo(s){const rows=recFor(s),h=rows.find(r=>/Hotel/.test(r.type));let place=h?(h.to||h.from):((rows.find(r=>r.to)||{}).to||'—');return{place,hotel:h?(h.to||h.what):'—',h}}
function renderPlace(id,s){const x=placeInfo(s);$(id).innerHTML=`<div class="label">Ort</div><div class="value">${esc(x.place)}</div><div class="label">Hotel</div><div class="value">${esc(x.hotel)}</div>${x.h&&x.h.booking?`<div class="small">Buchung ${esc(x.h.booking)}</div>`:''}`}
function nextOf(test){const key=iso(active),time='00:00';return DATA.records.filter(test).filter(r=>r.date>key||(r.date===key&&(r.time||'')>=time)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]}
function routeHtml(r,flight=false){return r?`<div class="label">${esc(r.dateDisplay)} · ${esc(r.time||'—')}</div><div class="route"><div>${esc(r.from||'—')}</div><div class="arrow">→</div><div>${esc(r.to||'—')}</div></div><div class="small">${esc(displayText(r))}${r.booking?` · Buchung ${esc(r.booking)}`:''}</div>`:'<div class="small">Kein weiterer Eintrag.</div>'}
function renderTodos(){const key=iso(active);const rows=DATA.records.filter(r=>!isDone(r)&&(r.open>0||r.due)).sort((a,b)=>(a.due||'9999')+(a.date||'')).slice(0,6);$('todos').innerHTML=rows.length?rows.map(r=>`<div class="todo ${r.due&&r.due<key?'urgent':''}"><b>${esc(displayText(r))}</b><div class="small">${esc([r.due?'Fällig '+r.due.split('-').reverse().join('.'):'',r.open?money(r.open):'',r.from&&r.to?`${r.from} → ${r.to}`:'' ].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="small">Keine offenen Pendenzen.</div>'}
function renderBudget(){const b=DATA.budget;$('budget').innerHTML=`<div class="budget"><div class="metric">Budget<b>${money(b.plan)}</b></div><div class="metric">Erfasste Kosten<b>${money(b.costs)}</b></div><div class="metric">Offen (beziffert)<b>${money(b.open)}</b></div><div class="metric">Restbudget${b.incomplete?' (vorläufig)':''}<b>${money(b.remaining)}</b></div></div>`}
function showInfo(title){const box=$('info');box.classList.remove('hidden');$('infoHead').textContent=title;let body='';if(title==='Reiseplan'){const rows=DATA.records.filter(r=>r.date>=tripStart&&r.date<=tripEnd);body=`<b>${rows.length} Reisedatensätze</b><div class="small" style="margin:8px 0 12px">Flüge: ${rows.filter(r=>/Flug/.test(r.type)).length} · Hotels: ${rows.filter(r=>/Hotel/.test(r.type)).length} · Transfers/Mietwagen: ${rows.filter(r=>/Transfer/.test(r.type)).length} · Aktivitäten: ${rows.filter(r=>/Aktivität/.test(r.type)).length}</div><table class="table"><tr><th>Datum</th><th>Zeit</th><th>Eintrag</th></tr>${rows.slice(0,40).map(r=>`<tr><td>${esc(r.dateDisplay)}</td><td>${esc(r.time)}</td><td><b>${esc(displayText(r))}</b><div class="small">${esc(r.from&&r.to?`${r.from} → ${r.to}`:'')}</div></td></tr>`).join('')}</table>`}else if(title==='Reiseunterlagen'){body='<b>Dokumentenabgleich folgt nach der Rohdatenprüfung.</b><div class="small" style="margin-top:8px">Es werden keine Unterlagen als vollständig markiert, bevor der PDF-/Voucher-Abgleich sauber abgeschlossen ist.</div>'}else{body=`<b>${esc(title)}</b><div class="small" style="margin-top:8px">In dieser Version noch nicht ausgebaut.</div>`}$('infoBody').innerHTML=body;box.scrollIntoView({behavior:'smooth'})}
async function init(){
try{
 DATA=await loadData();
 $('dataStatus').textContent=DATA.records.length+' Datensätze aus reisedaten.json geladen.';
 renderBudgetCheck(DATA);
const a=iso(active),b=iso(tomorrow),rows=recFor(a),phase=(rows.find(r=>r.phase)||{phase:'Reise'}).phase;
$('dayLabel').textContent='Tag '+dayNum(a)+' von 49';$('phase').textContent=phase;$('dateLabel').textContent=fmt(a);
renderDay('todayActivities',a);renderPlace('todayPlace',a);renderDay('tomorrowActivities',b);renderPlace('tomorrowPlace',b);
$('nextTransfer').innerHTML=routeHtml(nextOf(r=>/Transfer/.test(r.type)));$('nextFlight').innerHTML=routeHtml(nextOf(r=>/Flug/.test(r.type)),true);renderTodos();renderBudget();
}catch(e){$('dataStatus').textContent='Daten konnten nicht geladen werden: '+e.message;$('budgetCheck').textContent='';}
}
init();
</script>
</body></html>
